[package]
name = "konomanoasa-tree-sitter-diagnostic-sh"
version = "0.4.0"
edition = "2024"
description = "Tree-sitter grammar for diagnostics of POSIX sh."
readme = "README.md"
repository = "https://github.com/konomanoasa/tree-sitter-diagnostic-sh"
license = "MIT"
build = "bindings/rust/build.rs"
links = "tree-sitter-diagnostic-sh"
include = [
  "/LICENSE",
  "/README.md",
  "/bindings/rust/*.rs",
  "/src/*.c",
  "/src/node-types.json",
  "/src/tree_sitter/*.h",
  "/test/bindings.test.rs",
  "/test/support/parser-cases.json",
]

[lib]
path = "bindings/rust/lib.rs"

[[test]]
name = "bindings"
path = "test/bindings.test.rs"

[dependencies]
tree-sitter-language = "=0.1.9"

[dev-dependencies]
serde_json = "=1.0.154"
tree-sitter = "=0.27.1"

[build-dependencies]
cc = "=1.10.0"
